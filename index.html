      onActiveSlotIndexChange,
      hotbar,
      timePhase,
      timeFormatted,
      onCycleTime,
      onGenerateNewWorld,
      health,
      hunger,
      oxygen = 20,
      isUnderwater = false,
      mobsKilled,
      isHurtFlash,
      isDead,
      onRespawn,
      onEatFood,
    }) {
      const activeSlot = hotbar[activeSlotIndex];
      const activeItem = activeSlot?.itemId ? ITEM_REGISTRY[activeSlot.itemId] : null;

      return (
        <div className="absolute inset-0 pointer-events-none flex flex-col justify-between p-5 text-slate-100 font-sans">
          {/* Hurt flash */}
          {isHurtFlash && <div className="fixed inset-0 bg-rose-600/30 border-8 border-rose-600/60 pointer-events-none z-40 animate-pulse" />}

          {/* Underwater blue tint overlay */}
          {isUnderwater && <div className="fixed inset-0 bg-sky-600/15 pointer-events-none z-30 mix-blend-color-dodge" />}

          {/* Death screen */}
          {isDead && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center pointer-events-auto">
              <div className="max-w-md w-full bg-slate-900 border border-rose-900/50 rounded-2xl p-8 shadow-2xl flex flex-col items-center gap-4">
                <span className="text-5xl mb-1">☠️</span>
                <h1 className="text-4xl font-black text-rose-500 uppercase tracking-wider">You Died!</h1>
                <p className="text-slate-400 text-sm font-mono">You fell in combat during your survival adventure.</p>
                <div className="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-center my-2">
                  <span className="text-xs text-slate-500 font-mono block">MOBS DEFEATED</span>
                  <span className="text-2xl font-black text-emerald-400 font-mono">{mobsKilled}</span>
                </div>
                <button
                  onClick={onRespawn}
                  className="w-full py-3.5 px-6 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-mono font-bold text-sm uppercase shadow-lg transition-all cursor-pointer"
                >
                  Respawn
                </button>
              </div>
            </div>
          )}

          {/* Top Bar: Coordinates & Time */}
          <div className="flex justify-between items-start w-full">
            <div className="backdrop-blur-md bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex flex-col gap-1 shadow-xl pointer-events-auto text-xs font-mono">
              <div className="text-slate-400 font-bold border-b border-slate-700/50 pb-1 flex items-center justify-between gap-2">
                <span>🧭 Coordinates</span>
                <button
                  onClick={() => onGenerateNewWorld()}
                  title="Generate a brand new random procedural world"
                  className="px-2 py-0.5 bg-emerald-700/70 hover:bg-emerald-600 rounded text-[10px] text-white font-bold transition-all cursor-pointer"
                >
                  🎲 New World
                </button>
              </div>
              <div className="flex gap-3 text-emerald-300 font-bold">
                <span>X: {position.x.toFixed(1)}</span>
                <span>Y: {position.y.toFixed(1)}</span>
                <span>Z: {position.z.toFixed(1)}</span>
              </div>
              <div className="flex justify-between border-t border-slate-700/30 pt-1 text-slate-300">
                <span className="text-slate-500">Facing:</span>
                <span className="text-amber-400 font-bold">{facing}</span>
              </div>
              <div className="flex justify-between border-t border-slate-700/30 pt-1 text-slate-300">
                <span className="text-slate-500">Biome:</span>
                <span className="text-emerald-400 font-bold">🏞️ {biomeName}</span>
              </div>
              <div className="flex justify-between border-t border-slate-700/30 pt-1 text-slate-300">
                <span className="text-slate-500">World Seed:</span>
                <span className="text-sky-400 font-bold font-mono">#{worldSeed}</span>
              </div>
              <div className="flex justify-between border-t border-slate-700/30 pt-1 text-slate-300">
                <span className="text-slate-500">Mobs Defeated:</span>
                <span className="text-emerald-400 font-bold">⚔️ {mobsKilled}</span>
              </div>
            </div>

            {/* Time of Day Widget */}
            <div
              onClick={onCycleTime}
              title="Click or press [T] to cycle time"
              className="backdrop-blur-md bg-slate-900/80 border border-slate-700/60 hover:border-amber-500/50 rounded-xl p-3 flex items-center gap-3 shadow-xl pointer-events-auto cursor-pointer transition-all hover:scale-105 select-none"
            >
              <span className="text-2xl">{timePhase === "Night" ? "🌙" : timePhase === "Sunset" ? "🌅" : "☀️"}</span>
              <div className="flex flex-col">
                <span className="font-mono text-sm font-black text-amber-300">{timeFormatted}</span>
                <span className="font-mono text-[10px] text-slate-400 uppercase">{timePhase} • [T]</span>
              </div>
            </div>
          </div>

          {/* Crosshair */}
          {isLocked && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div className="relative w-6 h-6 flex items-center justify-center">
                <div className="absolute w-5 h-[2px] bg-white opacity-80 rounded-full mix-blend-difference" />
                <div className="absolute h-5 w-[2px] bg-white opacity-80 rounded-full mix-blend-difference" />
                <div className="w-[4px] h-[4px] bg-white rounded-full mix-blend-difference" />
              </div>
            </div>
          )}

          {/* Bottom Bar: Health, Hunger, Hotbar & Controls */}
          <div className="w-full flex justify-between items-end gap-6 pointer-events-none">
            <div className="w-[200px]" />

            {/* Hotbar & Survival Bars */}
            <div className="flex flex-col items-center gap-1.5 pointer-events-auto">
              {/* Oxygen Air Bubbles */}
              {(oxygen < 20 || isUnderwater) && (
                <div className="flex justify-end items-center gap-0.5 w-full pr-1 select-none">
                  {Array.from({ length: 10 }).map((_, i) => (
                    <span key={i} className="text-xs transition-all drop-shadow">
                      {oxygen >= (i + 1) * 2 ? "🫧" : "▫️"}
                    </span>
                  ))}
                </div>
              )}

              <div className="flex justify-between items-center w-full px-2 gap-8 text-sm select-none">
                {/* Health Hearts */}
                <div className="flex items-center gap-0.5">
                  {Array.from({ length: 10 }).map((_, i) => (
                    <span key={i} className="text-xs">
                      {health >= (i + 1) * 2 ? "❤️" : health >= (i + 1) * 2 - 1 ? "💔" : "🖤"}
                    </span>
                  ))}
                </div>
                {/* Hunger Drumsticks */}
                <div className="flex items-center gap-0.5 cursor-pointer" onClick={onEatFood}>
                  {Array.from({ length: 10 }).map((_, i) => (
                    <span key={i} className="text-xs">
                      {hunger >= (i + 1) * 2 ? "🥩" : hunger >= (i + 1) * 2 - 1 ? "🍖" : "🦴"}
                    </span>
                  ))}
                </div>
              </div>

              {/* Active Item Title */}
              <div className="bg-slate-950/85 border border-slate-800 rounded-full px-3 py-0.5 shadow-md">
                <span className="text-xs font-bold font-mono text-slate-200">
                  {activeItem ? activeItem.name : "Empty Hand"}
                </span>
              </div>

              {/* Hotbar Slots */}
              <div
                onWheel={(e) => {
                  const dir = Math.sign(e.deltaY);
                  if (dir !== 0) onActiveSlotIndexChange((activeSlotIndex + dir + 9) % 9);
                }}
                className="flex items-center gap-1.5 bg-slate-900/80 border border-slate-800 rounded-2xl p-2 shadow-2xl backdrop-blur-md"
              >
                {hotbar.map((slot, idx) => {
                  const item = slot.itemId ? ITEM_REGISTRY[slot.itemId] : null;
                  const isSel = idx === activeSlotIndex;
                  return (
                    <button
                      key={idx}
                      onClick={() => onActiveSlotIndexChange(idx)}
                      className={`relative w-12 h-12 rounded-xl flex items-center justify-center transition-all cursor-pointer ${
                        isSel ? "bg-slate-800 border-2 border-emerald-400 scale-110 shadow-lg -translate-y-1" : "bg-slate-950/50 border border-slate-800 hover:bg-slate-800/40"
                      }`}
                    >
                      {item ? (
                        <div className="relative flex items-center justify-center w-full h-full">
                          <span className="text-xl">{item.emoji}</span>
                          {slot.count > 1 && (
                            <span className="absolute bottom-0.5 right-1 text-[9px] font-mono font-bold bg-slate-950 px-1 rounded text-white border border-slate-700">
                              {slot.count}
                            </span>
                          )}
                        </div>
                      ) : (
                        <div className="w-6 h-6 border border-dashed border-slate-800 rounded-md" />
                      )}
                      <span className="absolute top-0.5 left-1 font-mono text-[8px] font-bold text-slate-500">{idx + 1}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Controls Guide Card */}
            <div className="pointer-events-auto backdrop-blur-md bg-slate-900/70 border border-slate-800/80 rounded-xl p-3 w-[210px] flex flex-col gap-1 text-[11px] font-mono shadow-lg">
              <span className="text-slate-400 font-bold pb-1 border-b border-slate-800">🕹️ Controls</span>
              <div className="flex justify-between"><span>WASD</span><span className="text-slate-400">Move / Swim</span></div>
              <div className="flex justify-between"><span>SPACE</span><span className="text-sky-300">Jump / Swim Up</span></div>
              <div className="flex justify-between"><span>SHIFT</span><span className="text-slate-400">Sink / Dive</span></div>
              <div className="flex justify-between"><span>L-CLICK</span><span className="text-emerald-400">Break/Attack</span></div>
              <div className="flex justify-between"><span>R-CLICK</span><span className="text-sky-400">Place/Use</span></div>
              <div className="flex justify-between"><span>E</span><span className="text-amber-400">Inventory</span></div>
              <div className="flex justify-between"><span>1-9</span><span className="text-slate-400">Hotbar</span></div>
              <div className="flex justify-between"><span>R</span><span className="text-rose-400">Unstuck</span></div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 9. START / PAUSE MODAL
    // ==========================================
    function StartModal({ seed, onPlay, onGenerateNewWorld }) {
      const [customSeed, setCustomSeed] = useState(seed);

      const presets = [
        { label: "🌲 Forest Hills", seed: "28471923" },
        { label: "🏔️ Mountain Crags", seed: "84910245" },
        { label: "🏜️ Desert Dunes", seed: "55219482" },
        { label: "❄️ Snowy Taiga", seed: "19472648" },
      ];

      const handleRandomize = () => {
        const rand = String(Math.floor(100000000 + Math.random() * 900000000));
        setCustomSeed(rand);
      };

      const handleStart = () => {
        if (customSeed !== seed) {
          onGenerateNewWorld(customSeed);
        } else {
          onPlay();
        }
      };

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl relative">
            <div className="absolute top-0 left-0 right-0 h-1.5 bg-emerald-500 rounded-t-2xl" />
            <h1 className="text-3xl font-black text-slate-100 uppercase tracking-tight mt-2">Minecraft Clone</h1>
            <p className="text-emerald-400 font-mono text-xs uppercase tracking-widest mt-1 font-bold">Infinite Procedural World</p>
            <p className="text-slate-400 text-sm mt-2 leading-relaxed">
              Explore dynamic multi-octave biomes, mine ores, craft tools, dive deep in oceans, and build anything!
            </p>

            {/* World Generation & Seed Box */}
            <div className="w-full mt-4 p-3 bg-slate-950/70 border border-slate-800 rounded-xl text-left flex flex-col gap-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-mono font-bold text-slate-400">WORLD SEED</span>
                <button
                  type="button"
                  onClick={handleRandomize}
                  className="text-xs font-mono text-emerald-400 hover:text-emerald-300 font-bold flex items-center gap-1 cursor-pointer"
                >
                  🎲 Randomize
                </button>
              </div>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={customSeed}
                  onChange={(e) => setCustomSeed(e.target.value)}
                  placeholder="Enter custom seed or text..."
                  className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-mono text-emerald-300 focus:outline-none focus:border-emerald-500"
                />
              </div>

              {/* Seed Presets */}
              <div className="flex flex-wrap gap-1.5 mt-1">
                {presets.map((p) => (
                  <button
                    key={p.seed}
                    type="button"
                    onClick={() => setCustomSeed(p.seed)}
                    className={`text-[10px] font-mono px-2 py-1 rounded-md border transition-all cursor-pointer ${
                      customSeed === p.seed
                        ? "bg-emerald-600/30 border-emerald-500 text-emerald-300 font-bold"
                        : "bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700"
                    }`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            </div>

            <button
              onClick={handleStart}
              className="w-full mt-5 py-3.5 px-6 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-base rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all cursor-pointer active:scale-95"
            >
              ▶ Enter World & Play
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 10. INVENTORY & CRAFTING MODAL
    // ==========================================
    function InventoryModal({ isOpen, onClose, inventory, hotbar, onInventoryChange, onHotbarChange, isCraftingTableOpen, onDropItem }) {
      const [cursorItem, setCursorItem] = useState(null);
      const [is3x3, setIs3x3] = useState(isCraftingTableOpen);
      const [craftGrid, setCraftGrid] = useState(() => Array.from({ length: 9 }, () => ({ itemId: "", count: 0 })));

      const activeGrid = is3x3 ? craftGrid : craftGrid.slice(0, 4);
      const craftResult = checkCraftingRecipe(activeGrid.map((s) => s.itemId));
      const craftDef = craftResult ? ITEM_REGISTRY[craftResult.itemId] : null;

      const handleSlotClick = (type, index, isRightClick) => {
        const list = type === "inventory" ? [...inventory] : [...hotbar];
        const updateList = type === "inventory" ? onInventoryChange : onHotbarChange;
        const cur = list[index];

        if (!cursorItem || !cursorItem.itemId) {
          if (!cur.itemId) return;
          if (isRightClick && cur.count > 1) {
            const take = Math.ceil(cur.count / 2);
            setCursorItem({ ...cur, count: take });
            list[index] = { ...cur, count: cur.count - take };
          } else {
            setCursorItem({ ...cur });
            list[index] = { itemId: "", count: 0 };
          }
          updateList(list);
        } else {
          if (!cur.itemId) {
            if (isRightClick) {
              list[index] = { ...cursorItem, count: 1 };
              if (cursorItem.count > 1) setCursorItem({ ...cursorItem, count: cursorItem.count - 1 });
              else setCursorItem(null);
            } else {
              list[index] = { ...cursorItem };
              setCursorItem(null);
            }
            updateList(list);
          } else if (cur.itemId === cursorItem.itemId) {
            const max = ITEM_REGISTRY[cur.itemId]?.maxStack || 64;
            if (isRightClick && cur.count < max) {
              list[index].count++;
              if (cursorItem.count > 1) setCursorItem({ ...cursorItem, count: cursorItem.count - 1 });
              else setCursorItem(null);
              updateList(list);
            } else {
              const transfer = Math.min(max - cur.count, cursorItem.count);
              list[index].count += transfer;
              if (cursorItem.count > transfer) setCursorItem({ ...cursorItem, count: cursorItem.count - transfer });
              else setCursorItem(null);
              updateList(list);
            }
          } else if (!isRightClick) {
            const temp = { ...cur };
            list[index] = { ...cursorItem };
            setCursorItem(temp);
            updateList(list);
          }
        }
      };

      const handleCraftResult = () => {
        if (!craftResult || !craftDef) return;
        setCursorItem({ itemId: craftResult.itemId, count: (cursorItem?.count || 0) + craftResult.count });
        setCraftGrid((prev) =>
          prev.map((slot, idx) => {
            const max = is3x3 ? 9 : 4;
            if (idx >= max || !slot.itemId) return slot;
            return slot.count > 1 ? { ...slot, count: slot.count - 1 } : { itemId: "", count: 0 };
          })
        );
      };

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md pointer-events-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl flex flex-col gap-4 text-slate-100 font-sans">
            <div className="flex justify-between items-center pb-2 border-b border-slate-800">
              <h2 className="text-lg font-bold">{is3x3 ? "🪵🧱 Crafting Table (3x3)" : "🎒 Inventory & 2x2 Crafting"}</h2>
              <button onClick={onClose} className="p-1 px-2.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white cursor-pointer font-bold">✕</button>
            </div>

            {/* Crafting Grid */}
            <div className="bg-slate-950/60 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
              <div className="flex flex-col gap-1">
                <div className="flex items-center gap-2">
                  <span className="text-[10px] uppercase font-bold text-slate-400 font-mono">{is3x3 ? "3x3 Grid" : "2x2 Grid"}</span>
                  <button onClick={() => setIs3x3(!is3x3)} className="text-[9px] bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-emerald-300">
                    Switch to {is3x3 ? "2x2" : "3x3"}
                  </button>
                </div>
                <div className={`grid gap-1.5 ${is3x3 ? "grid-cols-3" : "grid-cols-2"}`}>
                  {(is3x3 ? [0,1,2,3,4,5,6,7,8] : [0,1,2,3]).map((idx) => {
                    const slot = craftGrid[idx];
                    const item = slot.itemId ? ITEM_REGISTRY[slot.itemId] : null;
                    return (
                      <div
                        key={idx}
                        onClick={(e) => {
                          e.preventDefault();
                          const grid = [...craftGrid];
                          if (!cursorItem || !cursorItem.itemId) {
                            if (slot.itemId) { setCursorItem({ ...slot }); grid[idx] = { itemId: "", count: 0 }; setCraftGrid(grid); }
                          } else {
                            grid[idx] = { ...cursorItem, count: 1 };
                            if (cursorItem.count > 1) setCursorItem({ ...cursorItem, count: cursorItem.count - 1 });
                            else setCursorItem(null);
                            setCraftGrid(grid);
                          }
                        }}
                        className="w-10 h-10 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-600 flex items-center justify-center cursor-pointer relative"
                      >
                        {item && <span className="text-lg">{item.emoji}</span>}
                        {slot.count > 1 && <span className="absolute bottom-0.5 right-0.5 text-[8px] bg-slate-950 px-1 rounded text-emerald-400 font-mono">{slot.count}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Crafting Result */}
              <div className="flex flex-col items-center gap-1">
                <span className="text-[10px] font-mono text-emerald-400 font-bold uppercase">Result</span>
                <div
                  onClick={handleCraftResult}
                  className={`w-14 h-14 rounded-xl border flex items-center justify-center cursor-pointer transition-all ${
                    craftDef ? "bg-emerald-950/40 border-emerald-500/50 shadow-lg scale-105" : "bg-slate-950/40 border-slate-800 opacity-40 cursor-not-allowed"
                  }`}
                >
                  {craftDef && <span className="text-2xl">{craftDef.emoji}</span>}
                </div>
              </div>
            </div>

            {/* Main Inventory */}
            <div>
              <span className="text-[10px] font-mono uppercase text-slate-400 font-bold">Main Inventory</span>
              <div className="grid grid-cols-9 gap-1.5 p-2 bg-slate-950/40 border border-slate-800 rounded-xl mt-1">
                {inventory.map((slot, i) => {
                  const item = slot.itemId ? ITEM_REGISTRY[slot.itemId] : null;
                  return (
                    <div
                      key={i}
                      onClick={(e) => handleSlotClick("inventory", i, e.button === 2)}
                      onContextMenu={(e) => { e.preventDefault(); handleSlotClick("inventory", i, true); }}
                      className="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800 hover:border-slate-600 flex items-center justify-center cursor-pointer relative"
                    >
                      {item && <span className="text-lg">{item.emoji}</span>}
                      {slot.count > 1 && <span className="absolute bottom-0.5 right-0.5 text-[8px] bg-slate-900 px-1 rounded text-emerald-400 font-mono">{slot.count}</span>}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Hotbar */}
            <div>
              <span className="text-[10px] font-mono uppercase text-slate-400 font-bold">Quick Hotbar</span>
              <div className="grid grid-cols-9 gap-1.5 p-2 bg-slate-950/60 border border-emerald-500/20 rounded-xl mt-1">
                {hotbar.map((slot, i) => {
                  const item = slot.itemId ? ITEM_REGISTRY[slot.itemId] : null;
                  return (
                    <div
                      key={i}
                      onClick={(e) => handleSlotClick("hotbar", i, e.button === 2)}
                      onContextMenu={(e) => { e.preventDefault(); handleSlotClick("hotbar", i, true); }}
                      className="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800 hover:border-slate-600 flex items-center justify-center cursor-pointer relative"
                    >
                      {item && <span className="text-lg">{item.emoji}</span>}
                      {slot.count > 1 && <span className="absolute bottom-0.5 right-0.5 text-[8px] bg-slate-900 px-1 rounded text-emerald-400 font-mono">{slot.count}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<MinecraftApp />);
  </script>
</body>
</html>
